; VCThunder   launcher: VCThunder.exe   direct: VCThunder.exe hydro | offroad
; [section] applies to both titles; [<title>.section] wins for that title.
; Every key, its values and its default: docs/configuration.md.

[paths]
data_dir = data
save_dir = save

[graphics]
vcglide_renderer     = auto
vcglide_threads      = 0
vcglide_log          = vcglide.log
vcglide_verbose      = false
fullscreen           = false
window_scale         = 1
render_scale         = 1
aspect               = raster
; Hor+ widescreen: widens the frustum rather than stretching. Off ships the
; cabinet's own 4:3 raster.
widescreen           = false
; 400 is the cabinet's raster; auto cuts the top off every 400-row bitmap.
raster_height        = 400
; DANGER: 2 is 640x480, which an original arcade monitor may be damaged by.
video_mode           = auto
glide_capture        =
glide_capture_frames = 60
glide_frames         =

[timing]
cpu_hz        = 333000000
speed_percent = 100

[audio]
audio   = true
volume  = 100
; mix | cabinet (left = front speakers, right = seat woofer) | front
output  = mix
; 0..100, attenuate-only: 50 is both buses at unity, below it the seat woofer
; is attenuated, above it the front speakers.
balance = 15
dcs_ms  = 5

[controls]
dip_switches     = 0xFF
io_ms            = 16
input_background = true

[digital]
coin1        = 5
coin2        = 6
start1       = 1
service1     = 9
service_mode = F2
steer_left   = LEFT
steer_right  = RIGHT
throttle     = UP
brake        = DOWN
boost        = LCTRL
view_high    = LALT
view_low     = SPACE
view_pilot   = LSHIFT
volume_down  = MINUS
volume_up    = EQUALS

[analog]
provider         = auto
xinput_device    = 0
winmm_device     = 0
deadzone_percent = 12
pov_digital      = true

xinput_steering_axis   = lx
xinput_throttle_axis   = rt
xinput_brake_axis      = lt
xinput_steering_invert = false
xinput_throttle_invert = false
xinput_brake_invert    = false

winmm_steering_axis   = x
winmm_throttle_axis   = y
winmm_brake_axis      = none
winmm_pedal_mode      = combined
winmm_steering_invert = false
winmm_throttle_invert = true
winmm_brake_invert    = false

dinput_device            = auto
dinput_name              =
dinput_deadzone_percent  = 0
dinput_steering_axis     = x
dinput_throttle_axis     = y
dinput_brake_axis        = rz
dinput_pedal_mode        = separate
dinput_steering_invert   = false
dinput_throttle_invert   = true
dinput_brake_invert      = true
; 100 suits a wheel set to the cabinet's ~270 degrees; 30 suits one left at 900.
dinput_steering_range_percent = 100

[ffb]
; The game computes the force and writes it to the board's DAC; nothing here
; invents an effect. Needs a DirectInput wheel and the title's own F2 setting.
enabled             = true
; Which way a positive force turns the wheel: the cabinet's motor wiring, and
; in neither binary. Flip it if the wheel pushes you out of a corner.
invert              = true
strength_percent    = 100
device_gain_percent = 100
autocenter          = false

[gamepad]
; Button ordinals as the device's own control panel numbers them. 0 unbinds.
boost        = 1
view_high    = 2
view_low     = 3
view_pilot   = 4
coin1        = 7
coin2        = 0
start1       = 8
service1     = 0
service_mode = 0
volume_down  = 0
volume_up    = 0
shift1       = 0
shift2       = 0
shift3       = 0
; Offroad's three-position gate on two paddles: each rising edge steps a latch.
shift_up     = 0
shift_down   = 0

[offroad.digital]
throttle   = LCTRL
brake      = LALT
boost      = SPACE
view_high  = V
view_low   = B
view_pilot = N
shift1     = Z
shift2     = X
shift3     = C

[link]
; The transport the host puts under the games' own link protocol:
;   off   | standalone, and the default
;   local | two instances of this pack on this machine
;   lan   | a second machine on this network, which has never been measured
; Whether a cabinet links at all, and which unit it is, are the GAME'S operator
; settings in its NVRAM (service menu, F2). A second instance on this machine
; needs its own save_dir, log_file and vcglide_log: docs/configuration.md §7.
link           = off
link_rx_budget = 64

[diagnostics]
; log_file is read from here only, never from a [<title>.diagnostics].
log_file  = vcthunder.log
log_level = info
r2_cache  = true
stall_ms  = 60
; The developer switches (profilers, tracers, the null_* bisectors) are not
; shipped in this file. They still work if you add one: docs/configuration.md §6.
