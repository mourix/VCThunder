; VCThunder.   Launcher: VCThunder.exe    Direct: VCThunder.exe hydro | offroad
;
; This file carries the handful of settings a cabinet owner actually sets.
; Everything else has a sensible default and is on the launcher's own pages;
; "Show advanced settings on every page", on Troubleshooting, reveals the
; rest. Every key, every value and every default: docs/configuration.md.
;
; [section] applies to both titles; [<title>.section] wins for that title.

[paths]
data_dir = data
save_dir = save

[graphics]
fullscreen           = false
window_scale         = 1
; Draw the cabinet's picture at this multiple and scale it down: sharper, and
; the only setting here that costs real frame time.
render_scale         = 1
; 400 is the cabinet's raster. `auto` cuts the top off every 400-row bitmap.
raster_height        = 400
; Hor+ widescreen widens the frustum rather than stretching. A hack over the
; cabinet's raster, and off is what the cabinet did.
widescreen           = false
; DANGER: 2 is 640x480, which an original arcade monitor may be damaged by.
video_mode           = auto

[audio]
audio   = true
volume  = 100
; mix | cabinet (left = front speakers, right = seat woofer) | front
output  = mix
; 0..100, attenuate-only: 50 is both buses at unity, below it the seat woofer
; is attenuated, above it the front speakers.
balance = 15

[controls]
; Keep reading the controls when the window is not in front.
input_background = true

; ---------------------------------------------------------------------------
; [devices], a name for a controller, so its settings can be its own, and so
; a second one can be bound alongside it. The launcher writes these; by hand:
;
;   [devices]
;   tmx = dinput:Thrustmaster TMX
;   th8 = dinput:TH8A
;
;   [analog.tmx]
;   dinput_throttle_axis = rz
;
;   [offroad.gamepad]
;   shift1 = th8:1
;
; docs/configuration.md has the whole grammar. There is no [analog] block in
; this file: every axis setting has a default, the launcher's Set up measures
; the ones that need measuring, and what it writes is what changed.
; ---------------------------------------------------------------------------

[ffb]
; The game computes the force and writes it to the board; nothing here invents
; an effect. A wheel takes it through DirectInput and needs the title's own
; F2 setting too. `enabled` switches BOTH kinds, wheel force and pad rumble.
enabled          = true
strength_percent = 100
; A pad has no force axis. These drive its two motors from the same command,
; derived, not the arcade effect, and a wheel never gets it.
rumble           = true

; ---- per-title rumble trim -------------------------------------------------
; The two cabinets do not need the same bed and one key cannot serve both:
; Hydro's continuous units are quiet where Offroad's are loud. Tuned by driving
; both titles; one number for both has been wrong every time it was tried.
[hydro.ffb]
rumble_texture_percent       = 100
rumble_texture_curve_percent = 100

[offroad.ffb]
rumble_texture_percent       = 8

; The keyboard and controller maps are the cabinets' own defaults until you
; change one on the launcher's Controls page, which then writes the line it
; changed and nothing else. docs/configuration.md lists every action.

[link]
; off | local (two instances of this pack here) | lan (a second machine).
; Whether a cabinet links at all, and which unit it is, are the GAME's operator
; settings in its NVRAM (service menu, F2).
link = off

[diagnostics]
log_file  = vcthunder.log
log_level = info
